<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><base href="https://d16ilfvy4mv02r.cloudfront.net/workspaces/h8FA1vFPdFF9grlALTcLVBHZow3V21rv/0a6fd57e-2b7f-4282-999d-d3c1686556c1/files/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0ea47a">
<title>ChatFlow — Connect. Chat. Get Answers.</title>
<style>
/* ============================================================
   ChatFlow — original design system
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
:root{
  --accent:#0ea47a; --accent-600:#0b8f6a; --accent-100:#d6f5ea; --accent-2:#34d399;
  --bg:#eef2f5; --panel:#ffffff; --panel-2:#f6f8fa; --panel-3:#eef2f5;
  --text:#111b21; --muted:#667781; --border:#e3e9ee;
  --bubble-out:#d9fdd3; --bubble-in:#ffffff; --bubble-out-txt:#111b21;
  --danger:#e5484d; --warn:#f5a623; --info:#3b82f6;
  --shadow-sm:0 1px 2px rgba(11,20,26,.06);
  --shadow:0 2px 10px rgba(11,20,26,.08),0 1px 2px rgba(11,20,26,.06);
  --shadow-lg:0 18px 50px rgba(11,20,26,.18);
  --radius:16px; --radius-sm:11px;
  --sidebar-w:372px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
[data-theme="dark"]{
  --accent:#18b48a; --accent-600:#12a077; --accent-100:#0c2f28; --accent-2:#2dd4a7;
  --bg:#0b141a; --panel:#111b21; --panel-2:#182229; --panel-3:#0e181e;
  --text:#e9edef; --muted:#8696a0; --border:#243139;
  --bubble-out:#005c4b; --bubble-in:#202c33; --bubble-out-txt:#e9edef;
  --shadow:0 2px 12px rgba(0,0,0,.4);
  --shadow-lg:0 20px 60px rgba(0,0,0,.6);
}
body{
  margin:0; font-family:var(--font); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; overflow:hidden;
  transition:background .25s ease,color .25s ease;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,textarea,select{outline:none}
a{color:var(--accent)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(134,150,160,.35);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(134,150,160,.6)}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}
.ic{width:22px;height:22px;display:inline-block;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}
.ic.lg{width:26px;height:26px}
.ic.fill{fill:currentColor;stroke:none}

/* ---------- buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:11px;font-weight:600;font-size:14.5px;transition:.16s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(14,164,122,.28)}
.btn-primary:hover{background:var(--accent-600)}
.btn-ghost{background:var(--panel-2);color:var(--text)}
.btn-ghost:hover{background:var(--panel-3)}
.btn-outline{border:1.5px solid var(--border);color:var(--text)}
.btn-outline:hover{background:var(--panel-2)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:9px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.01em}
.input,textarea.input,select.input{width:100%;padding:12px 14px;border-radius:11px;border:1.5px solid var(--border);background:var(--panel-2);color:var(--text);font-size:14.5px;transition:.16s}
.input:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-100)}
textarea.input{resize:vertical;min-height:84px}
select.input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%23667781' stroke-width='2'><path d='M3 5l4 4 4-4'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:36px}
.row{display:flex;gap:10px}.row>*{flex:1}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.switch{position:relative;width:44px;height:25px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--border);border-radius:99px;transition:.2s}
.switch span::after{content:"";position:absolute;width:19px;height:19px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:var(--shadow-sm)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(19px)}

/* ---------- auth ---------- */
#auth{position:fixed;inset:0;display:grid;grid-template-columns:1.05fr .95fr;background:var(--panel);z-index:50}
.auth-hero{position:relative;overflow:hidden;background:linear-gradient(150deg,#0b8f6a,#0ea47a 45%,#2dd4a7);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:44px}
.auth-hero::before{content:"";position:absolute;width:560px;height:560px;border-radius:50%;background:rgba(255,255,255,.08);top:-180px;right:-160px}
.auth-hero::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.06);bottom:-170px;left:-120px}
.auth-brand{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.auth-brand .mark{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.16);display:grid;place-items:center;backdrop-filter:blur(4px)}
.auth-hero h1{font-size:40px;line-height:1.1;margin:0 0 12px;position:relative;z-index:2;font-weight:800;letter-spacing:-.02em}
.auth-hero p{font-size:16px;opacity:.92;max-width:420px;position:relative;z-index:2;line-height:1.6}
.auth-feats{position:relative;z-index:2;display:flex;flex-direction:column;gap:14px}
.auth-feat{display:flex;gap:12px;align-items:center;font-size:14.5px}
.auth-feat .fi{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.auth-panel{display:flex;align-items:center;justify-content:center;padding:34px;overflow-y:auto}
.auth-card{width:100%;max-width:392px}
.auth-card h2{margin:0 0 6px;font-size:25px;letter-spacing:-.02em}
.auth-card .sub{color:var(--muted);font-size:14px;margin-bottom:22px}
.auth-alt{text-align:center;font-size:13.5px;color:var(--muted);margin-top:18px}
.otp-row{display:flex;gap:9px;justify-content:space-between}
.otp-row input{width:100%;text-align:center;font-size:21px;font-weight:700;padding:13px 0;border-radius:11px;border:1.5px solid var(--border);background:var(--panel-2)}
.otp-row input:focus{border-color:var(--accent)}
.pw-meter{height:5px;border-radius:99px;background:var(--border);margin-top:8px;overflow:hidden}
.pw-meter i{display:block;height:100%;width:0;background:var(--danger);transition:.3s}

/* ---------- app shell ---------- */
#app{position:fixed;inset:0;display:flex;opacity:0;transition:opacity .3s}
#app.ready{opacity:1}
.shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;width:100%;height:100%;background:var(--panel);position:relative}
[data-view="updates"] .shell,[data-view="calls"] .shell,[data-view="settings"] .shell,[data-view="admin"] .shell,[data-view="communities"] .shell{grid-template-columns:var(--sidebar-w) 1fr}

/* ---------- sidebar ---------- */
.sidebar{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border);min-width:0;position:relative;z-index:3}
.side-head{padding:14px 16px 10px;display:flex;flex-direction:column;gap:12px;background:var(--panel)}
.brand-row{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand .mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(140deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(14,164,122,.3)}
.head-actions{display:flex;gap:4px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:.15s}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.search-wrap{position:relative}
.search-wrap .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search-wrap input{width:100%;padding:11px 14px 11px 40px;border-radius:11px;border:1.5px solid transparent;background:var(--panel-2);font-size:14px}
.search-wrap input:focus{border-color:var(--accent);background:var(--panel)}
.rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--panel-2);font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;border:1.5px solid transparent}
.chip.active{background:var(--accent-100);color:var(--accent-600);border-color:var(--accent)}
.side-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 8px 90px}
.list-label{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.conv{display:flex;gap:12px;padding:10px;border-radius:13px;cursor:pointer;transition:.13s;align-items:center;position:relative}
.conv:hover{background:var(--panel-2)}
.conv.active{background:var(--accent-100)}
.conv .body{flex:1;min-width:0}
.conv .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.conv .name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .time{font-size:11.5px;color:var(--muted);flex:none}
.conv .msg{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px;margin-top:2px}
.conv .msg .ic{width:15px;height:15px}
.badge{background:var(--accent);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:99px;display:grid;place-items:center;padding:0 6px}
.avatar{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:17px;position:relative;background:linear-gradient(140deg,#6b7cff,#8b5cf6);overflow:hidden;user-select:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sm{width:36px;height:36px;font-size:13px}
.avatar.xs{width:26px;height:26px;font-size:11px}
.avatar.lg{width:104px;height:104px;font-size:36px}
.avatar.ai{background:linear-gradient(140deg,#0ea47a,#34d399)}
.avatar .dot{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:#22c55e;border:2.5px solid var(--panel)}
.avatar .dot.off{background:#9aa6ad}

/* ---------- main / chat ---------- */
.main{display:flex;flex-direction:column;min-width:0;background:var(--panel-3);position:relative}
.chat-head{display:flex;align-items:center;gap:13px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);min-height:64px;z-index:2}
.chat-head .who{flex:1;min-width:0;cursor:pointer}
.chat-head .who .n{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .who .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .who .s.online{color:var(--accent)}
.only-mobile{display:none}
.msg-scroll{flex:1;overflow-y:auto;padding:22px 7% 14px;display:flex;flex-direction:column;gap:3px;background-image:radial-gradient(circle at 12% 20%,rgba(14,164,122,.05),transparent 42%),radial-gradient(circle at 88% 78%,rgba(59,130,246,.05),transparent 42%)}
.daysep{align-self:center;background:var(--panel);color:var(--muted);font-size:11.5px;font-weight:600;padding:5px 13px;border-radius:99px;margin:12px 0;box-shadow:var(--shadow-sm)}
.sysmsg{align-self:center;background:var(--panel);color:var(--muted);font-size:12px;padding:6px 14px;border-radius:99px;margin:8px 0;text-align:center;max-width:80%;box-shadow:var(--shadow-sm)}
.msg{max-width:min(74%,560px);align-self:flex-start;position:relative;margin-top:2px}
.msg.out{align-self:flex-end}
.msg .bubble{background:var(--bubble-in);color:var(--text);padding:8px 11px 6px;border-radius:14px 14px 14px 5px;box-shadow:var(--shadow-sm);position:relative;word-wrap:break-word;overflow-wrap:anywhere;animation:pop .22s ease}
.msg.out .bubble{background:var(--bubble-out);color:var(--bubble-out-txt);border-radius:14px 14px 5px 14px}
@keyframes pop{from{opacity:0;transform:translateY(7px) scale(.98)}to{opacity:1;transform:none}}
.msg .txt{font-size:14.6px;line-height:1.44;white-space:pre-wrap}
.msg .txt a{word-break:break-all}
.msg .meta{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:11px;color:var(--muted);margin-top:3px;float:right;padding-left:10px}
.msg.out .meta .ic{color:var(--accent)}
.msg .meta .ic{width:15px;height:15px;stroke-width:2.2}
.msg.media .bubble{padding:5px}
.msg.media .txt{padding:4px 6px 0}
.msg img.attach{max-width:100%;border-radius:10px;display:block;cursor:pointer}
.msg video.attach{max-width:100%;border-radius:10px;display:block}
.doc{display:flex;gap:11px;align-items:center;padding:9px 6px;min-width:210px}
.doc .di{width:40px;height:40px;border-radius:10px;background:var(--accent-100);color:var(--accent-600);display:grid;place-items:center;flex:none}
.doc .dn{font-size:13.5px;font-weight:600;word-break:break-all}
.doc .ds{font-size:11.5px;color:var(--muted)}
.voice{display:flex;align-items:center;gap:10px;padding:6px 4px;min-width:210px}
.voice .wave{flex:1;height:26px;display:flex;align-items:center;gap:2.5px}
.voice .wave i{width:2.5px;border-radius:2px;background:var(--accent);opacity:.55;animation:wv 1.1s infinite ease-in-out}
@keyframes wv{0%,100%{height:22%}50%{height:100%}}
.voice .dur{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.voice .play{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.reply-quote{border-left:3px solid var(--accent);background:rgba(14,164,122,.09);padding:5px 9px;border-radius:7px;margin-bottom:5px;font-size:12.5px;cursor:pointer}
.reply-quote b{display:block;color:var(--accent-600);font-size:12px}
.reply-quote span{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reactions{display:flex;gap:3px;position:absolute;bottom:-9px;left:8px}
.msg.out .reactions{left:auto;right:8px}
.reactions .r{background:var(--panel);border:1px solid var(--border);border-radius:99px;padding:1px 6px;font-size:12px;box-shadow:var(--shadow-sm);cursor:pointer}
.msg-tools{position:absolute;top:-2px;display:none;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:99px;padding:3px;box-shadow:var(--shadow)}
.msg.out .msg-tools{right:100%;margin-right:6px}
.msg:not(.out) .msg-tools{left:100%;margin-left:6px}
.msg:hover .msg-tools{display:flex}
.msg-tools button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.msg-tools button:hover{background:var(--panel-2);color:var(--accent)}
.msg-tools .ic{width:16px;height:16px}
.edited{font-size:10.5px;color:var(--muted);font-style:italic}
.typing{display:flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:tp 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

/* ---------- composer ---------- */
.composer{padding:10px 14px 14px;background:var(--panel);border-top:1px solid var(--border);position:relative}
.reply-bar{display:flex;align-items:center;gap:10px;background:var(--panel-2);border-left:3px solid var(--accent);border-radius:9px;padding:8px 11px;margin-bottom:8px;font-size:13px}
.reply-bar .rb-body{flex:1;min-width:0}
.reply-bar b{font-size:12px;color:var(--accent-600)}
.reply-bar div{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp-row{display:flex;align-items:flex-end;gap:8px}
.comp-box{flex:1;display:flex;align-items:flex-end;gap:4px;background:var(--panel-2);border:1.5px solid transparent;border-radius:24px;padding:5px 8px 5px 10px;transition:.15s}
.comp-box:focus-within{border-color:var(--accent);background:var(--panel)}
.comp-box textarea{flex:1;border:0;background:none;resize:none;max-height:130px;min-height:24px;padding:7px 2px;font-size:14.8px;line-height:1.4}
.send-btn{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 14px rgba(14,164,122,.3);transition:.16s}
.send-btn:hover{background:var(--accent-600);transform:scale(1.05)}
.mic-btn{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.recording{display:flex;align-items:center;gap:10px;flex:1;color:var(--danger);font-weight:600;font-size:14px}
.rec-dot{width:11px;height:11px;border-radius:50%;background:var(--danger);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.emoji-pop{position:absolute;bottom:74px;left:14px;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:10px;width:308px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;z-index:9;max-height:230px;overflow-y:auto}
.emoji-pop button{font-size:21px;padding:4px;border-radius:8px;line-height:1}
.emoji-pop button:hover{background:var(--panel-2)}

/* ---------- empty / welcome ---------- */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px;text-align:center}
.empty .logo{width:104px;height:104px;border-radius:30px;background:linear-gradient(140deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;box-shadow:0 18px 44px rgba(14,164,122,.32)}
.empty h2{margin:0;font-size:27px;letter-spacing:-.02em}
.empty p{color:var(--muted);max-width:440px;margin:0;line-height:1.6}
.empty .hint{font-size:12.5px;color:var(--muted);border-top:1px solid var(--border);padding-top:14px;margin-top:6px}

/* ---------- AI welcome ---------- */
.ai-hero{padding:26px 22px;text-align:center;border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--accent-100),transparent)}
.ai-hero .avatar{margin:0 auto 12px}
.ai-hero h3{margin:0 0 6px;font-size:20px}
.ai-hero p{color:var(--muted);font-size:13.5px;max-width:520px;margin:0 auto;line-height:1.6}
.ai-notice{display:flex;gap:9px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--border);border-radius:11px;padding:11px 13px;font-size:12.5px;color:var(--muted);max-width:560px;margin:14px auto 0;text-align:left;line-height:1.5}
.ai-notice .ic{color:var(--warn);flex:none;margin-top:1px}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;max-width:600px;margin:20px auto 0;width:100%}
.quick{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:13px;background:var(--panel);border:1.5px solid var(--border);text-align:left;font-size:13.5px;font-weight:600;transition:.16s;box-shadow:var(--shadow-sm)}
.quick:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.quick .qi{width:34px;height:34px;border-radius:10px;background:var(--accent-100);color:var(--accent-600);display:grid;place-items:center;flex:none}

/* ---------- generic page ---------- */
.page{flex:1;overflow-y:auto;background:var(--panel-3)}
.page-head{padding:22px 26px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:var(--panel-3);z-index:2;backdrop-filter:blur(8px)}
.page-head h2{margin:0;font-size:23px;letter-spacing:-.02em}
.page-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.page-body{padding:8px 26px 40px;max-width:920px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.card h3{margin:0 0 4px;font-size:16px}
.card .desc{color:var(--muted);font-size:13px;margin:0 0 14px;line-height:1.5}
.set-row{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:0}
.set-row .si{width:38px;height:38px;border-radius:11px;background:var(--panel-2);color:var(--accent-600);display:grid;place-items:center;flex:none}
.set-row .st{flex:1;min-width:0}
.set-row .st b{display:block;font-size:14px;font-weight:600}
.set-row .st span{font-size:12.5px;color:var(--muted)}
.set-row.click{cursor:pointer;border-radius:11px;padding:13px 8px}
.set-row.click:hover{background:var(--panel-2)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:15px;box-shadow:var(--shadow-sm)}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.stat .val{font-size:26px;font-weight:800;margin-top:7px;letter-spacing:-.02em}
.stat .dlt{font-size:11.5px;color:var(--accent-600);font-weight:600;margin-top:3px}
.stat .dlt.down{color:var(--danger)}
.bar{height:8px;border-radius:99px;background:var(--panel-3);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .4s}
.tabs{display:flex;gap:4px;background:var(--panel-2);padding:4px;border-radius:12px;margin-bottom:14px;overflow-x:auto}
.tabs button{padding:8px 15px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.active{background:var(--panel);color:var(--accent-600);box-shadow:var(--shadow-sm)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:left;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--border)}
table.tbl td{padding:11px 10px;border-bottom:1px solid var(--border)}
table.tbl tr:last-child td{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
.pill.ok{background:var(--accent-100);color:var(--accent-600)}
.pill.warn{background:rgba(245,166,35,.16);color:#b57400}
.pill.err{background:rgba(229,72,77,.14);color:var(--danger)}
.pill.info{background:rgba(59,130,246,.14);color:#2563eb}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-state .ic{width:46px;height:46px;opacity:.4;margin-bottom:10px}

/* ---------- updates ---------- */
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 26px 18px}
.story{width:104px;flex:none;text-align:center;cursor:pointer}
.story .ring{width:92px;height:92px;border-radius:50%;padding:3px;background:linear-gradient(140deg,var(--accent),var(--accent-2));margin:0 auto 7px}
.story.seen .ring{background:var(--border)}
.story .ring .avatar{width:100%;height:100%;border:3px solid var(--panel-3)}
.story .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story.add .ring{background:var(--panel-2);border:2px dashed var(--accent);display:grid;place-items:center}
.story.add .ring .avatar{display:none}
.upd{display:flex;gap:13px;align-items:center;padding:13px;border-radius:14px;cursor:pointer}
.upd:hover{background:var(--panel-2)}
.upd .u-body{flex:1;min-width:0}
.upd .u-body b{font-size:14.5px}
.upd .u-body span{display:block;font-size:12.5px;color:var(--muted)}
.upd .thumb{width:46px;height:46px;border-radius:11px;object-fit:cover;background:var(--panel-2)}

/* ---------- calls ---------- */
.call-row{display:flex;gap:13px;align-items:center;padding:13px;border-radius:14px}
.call-row:hover{background:var(--panel-2)}
.call-row .ic.miss{color:var(--danger)}
.call-row .ic.in{color:var(--accent)}

/* ---------- communities ---------- */
.comm-card{display:flex;gap:14px;padding:16px;border-radius:16px;background:var(--panel);border:1px solid var(--border);margin-bottom:12px;box-shadow:var(--shadow-sm);cursor:pointer;transition:.16s}
.comm-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.comm-card .cover{width:64px;height:64px;border-radius:16px;background:linear-gradient(140deg,#6b7cff,#8b5cf6);display:grid;place-items:center;color:#fff;font-size:24px;flex:none}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(11,20,26,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:80;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border-radius:18px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:up .25s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.modal.wide{max-width:640px}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:var(--panel);z-index:2}
.modal-head h3{margin:0;font-size:17px}
.modal-body{padding:18px 20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--panel)}
.list-pick{display:flex;gap:11px;align-items:center;padding:10px;border-radius:12px;cursor:pointer}
.list-pick:hover{background:var(--panel-2)}
.list-pick.sel{background:var(--accent-100)}

/* ---------- toast ---------- */
#toast-root{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:120;align-items:center}
.toast{background:#111b21;color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);animation:tin .25s;display:flex;gap:9px;align-items:center;max-width:92vw}
[data-theme="dark"] .toast{background:#e9edef;color:#111b21}
.toast .ic{width:18px;height:18px;color:var(--accent-2)}
@keyframes tin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- bottom nav ---------- */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:62px;background:var(--panel);border-top:1px solid var(--border);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav .bn-inner{display:flex;height:62px}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;position:relative}
.bn.active{color:var(--accent)}
.bn .ic{width:23px;height:23px}
.bn .badge{position:absolute;top:6px;right:calc(50% - 20px);font-size:10px;min-width:17px;height:17px}

/* ---------- admin ---------- */
.admin-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(139,92,246,.14);color:#7c3aed;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
.code{background:var(--panel-3);border:1px solid var(--border);border-radius:10px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;overflow-x:auto;white-space:pre;line-height:1.5}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.5;margin-bottom:12px}
.alert.warn{background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.4);color:#8a5a00}
.alert.info{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3)}
.alert.err{background:rgba(229,72,77,.1);border:1px solid rgba(229,72,77,.35);color:var(--danger)}
.alert.ok{background:var(--accent-100);border:1px solid var(--accent);color:var(--accent-600)}
[data-theme="dark"] .alert.warn{color:#f5c66b}

/* ---------- misc ---------- */
.muted{color:var(--muted)}
.center{text-align:center}
.mt0{margin-top:0}.mt8{margin-top:8px}.mt16{margin-top:16px}.mb0{margin-bottom:0}.mb12{margin-bottom:12px}
.flex{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.tiny{font-size:11.5px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.divider{height:1px;background:var(--border);margin:14px 0}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.spin.dark{border-color:var(--border);border-top-color:var(--accent)}
.blink-caret{display:inline-block;width:7px;height:15px;background:var(--accent);animation:blink .8s step-end infinite;vertical-align:text-bottom;margin-left:1px}

/* ---------- responsive ---------- */
@media(max-width:900px){
  #auth{grid-template-columns:1fr}
  .auth-hero{display:none}
  .auth-panel{padding:24px 18px}
}
@media(max-width:820px){
  .shell{grid-template-columns:1fr!important}
  .main{display:none}
  body[data-mobile="chat"] .sidebar{display:none}
  body[data-mobile="chat"] .main{display:flex}
  .only-mobile{display:grid}
  .sidebar{border-right:0}
  .bottom-nav{display:block}
  .side-list{padding-bottom:80px}
  .page{padding-bottom:70px}
  .msg-scroll{padding:16px 12px 10px}
  .msg{max-width:86%}
  .page-head,.page-body,.stories{padding-left:16px;padding-right:16px}
  .grid3,.grid4{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .auth-hero{padding:30px}
}
@media(max-width:480px){
  .grid3,.grid4{grid-template-columns:1fr 1fr}
  .quick-grid{grid-template-columns:1fr}
  .modal-body{padding:16px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
</style>

  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:d.getFullYear()!==t.getFullYear()?'numeric':undefined}); }
function timeAgo(ts){ const s=(now()-ts)/1000; if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; const d=Math.floor(s/86400); if(d<7) return d+'d ago'; return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }

  return `<div class="${cls2}" style="background:linear-gradient(140deg,${colorFor(user.name)},${colorFor(user.name+'x')})">${esc(initials(user.name))}</div>`;
}

function isValidTopic(t){ if(!t) return false; const w=String(t).toLowerCase().trim(); if(w.length<2) return false;
  if(/^(it|that|this|they|them|those|these|me|you|us|more|less|simply|more simply|more detail|detail|an example|example|it used|is it used|all)$/.test(w)) return false;
  if(/^(what|why|how|when|where|who|is|are|do|does|the|a|an)\b/.test(w)) return false; return true; }
function detectTopic(userMsgs){
  // Scans newest → oldest. Invalid/pronoun matches are skipped so that
  // follow-ups like "where is it used?" or "explain more simply" inherit the
  // most recent genuine topic of the conversation.
  for(let i=userMsgs.length-1;i>=0;i--){
    const m=userMsgs[i];
    let mt=m.match(/(?:what(?:'s| is| are)|define|explain|tell me about|who is|who are|describe|how does|how do|where is|where are|when is|why is|why do|why does)\s+(?:a |an |the )?([a-z0-9][a-z0-9\s\-\.\+']{1,40})/i);
    if(mt){ const t=normTopic(mt[1]); if(isValidTopic(t)) return t; }
    mt=m.match(/(?:translate|summari[sz]e|brainstorm|ideas for|write (?:a|an|the) )\s+([a-z0-9][a-z0-9\s\-]{1,40})/i);
    if(mt){ const t=normTopic(mt[1]); if(isValidTopic(t)) return t; }
  }
  return null;
}
function kbSearch(q, settings){
  const words=String(q).toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3);
  let best=null, bestScore=0;
  for(const e of (settings.knowledge||[])){
    const hay=(e.title+' '+e.category+' '+e.content).toLowerCase();
    let score=0; for(const w of words) if(hay.includes(w)) score++;
    if(/chatflow|pricing|plan|support|contact|refund|policy|polic|feature|company/.test(q.toLowerCase()) && score>0) score+=1;
    if(score>bestScore){ bestScore=score; best=e; }
  }
  return bestScore>=1?best:null;
}
function detectLang(t){ const m=t.match(/(?:into|to)\s+(spanish|french|german|italian|portuguese|hindi|arabic|chinese|japanese|english)/i); return m?m[1].toLowerCase():null; }
const MINI_DICT={
  spanish:{hello:'Hola',thanks:'Gracias',goodbye:'Adiós',yes:'Sí',no:'No','good morning':'Buenos días','how are you':'¿Cómo estás?'},
  french:{hello:'Bonjour',thanks:'Merci',goodbye:'Au revoir',yes:'Oui',no:'Non','good morning':'Bonjour','how are you':'Comment allez-vous ?'},
  german:{hello:'Hallo',thanks:'Danke',goodbye:'Tschüss',yes:'Ja',no:'Nein','good morning':'Guten Morgen','how are you':'Wie geht es dir?'},
  italian:{hello:'Ciao',thanks:'Grazie',goodbye:'Arrivederci',yes:'Sì',no:'No','good morning':'Buongiorno','how are you':'Come stai?'},
  portuguese:{hello:'Olá',thanks:'Obrigado',goodbye:'Adeus',yes:'Sim',no:'Não','good morning':'Bom dia','how are you':'Como vai você?'}
};
function safeMath(expr){ if(!/^[\d\s\+\-\*\/\(\)\.%]+$/.test(expr)) return null; try{ const v=Function('"use strict";return ('+expr+')')(); return (typeof v==='number'&&isFinite(v))?v:null; }catch(e){ return null; } }

/* ------------------------- built-in demo engine -------------------------- */
function simulatedAI(messages, settings){
  const userMsgs=messages.filter(m=>m.role==='user').map(m=>m.content);
  const q=(userMsgs[userMsgs.length-1]||'').trim();
  const lower=q.toLowerCase();
  const topic=detectTopic(userMsgs);
  const tinfo=topic&&TOPICS[topic];

  const wrap=(body)=>body;

  if(!q) return {text:"Ask me anything and I'll do my best to help.", usage:simUsage(q,'')};

  // knowledge base first
  const kb=kbSearch(q, settings);
  if(kb && /chatflow|pricing|plan|price|support|contact|refund|policy|policies|feature|company|business|hours|product|service/i.test(lower)){
    const ans=`**${kb.title}** (${kb.category})\n\n${kb.content}\n\nIs there anything else about ChatFlow you'd like to know?`;
    return {text:ans, usage:simUsage(q,ans), source:'knowledge base'};
  }

  // support / human
  if(/\b(human|agent|support|representative|talk to someone|real person)\b/.test(lower))
    return {text:"I can pass this along to the ChatFlow support team. Tap **Contact Support** in the ChatFlow AI menu and your conversation (with context) will be submitted — a human will follow up by email. Support hours are Monday to Friday, 9am–6pm.", usage:simUsage(q,'')};

  // identity / help
  if(/\b(who are you|what are you|your name|about you)\b/.test(lower))
    return {text:"I'm **ChatFlow AI**, the assistant built into ChatFlow. I can answer questions, explain topics, help you write, brainstorm ideas and translate text. I'm always available — just type your question.", usage:simUsage(q,'')};
  if(/\b(what can you do|what can you help with|how (do|can) i use you|your capabilities)\b/.test(lower))
    return {text:"Here's what I can help with:\n\n• **Answer questions** — explain a topic, define a term\n• **Write** — emails, messages, captions, summaries\n• **Brainstorm** — ideas, names, angles\n• **Translate** — short phrases into common languages\n• **Work things out** — quick calculations and planning\n\nTry the quick actions on the welcome screen, or just ask.", usage:simUsage(q,'')};

  // greeting
  if(/^(hi|hey|hello|yo|good (morning|afternoon|evening))\b/.test(lower) && q.length<24)
    return {text:"Hey! 👋 What would you like to know? I can explain a topic, help you write something, brainstorm ideas or translate a phrase.", usage:simUsage(q,'')};

  // thanks
  if(/^(thanks|thank you|ty|cheers)\b/.test(lower) && q.length<26)
    return {text:"You're welcome! Anything else I can help with?", usage:simUsage(q,'')};

  // math
  const mathMatch=q.match(/(?:what(?:'s| is)|calculate|compute|=)?\s*([\d\.\)\s\+\-\*\/\(]+[\d\)])\s*\??$/i);
  if(mathMatch){ const v=safeMath(mathMatch[1].trim()); if(v!==null) return {text:`${mathMatch[1].trim()} = **${v}**`, usage:simUsage(q,'')}; }

  // translate
  if(/\btranslate\b/.test(lower)){
    const lang=detectLang(lower);
    const src=q.replace(/.*translate\s*/i,'').replace(/\s*(into|to)\s+\w+\s*/i,'').replace(/^["'\s]+|["'\s]+$/g,'').toLowerCase();
    if(lang&&MINI_DICT[lang]&&MINI_DICT[lang][src])
      return {text:`**${src}** in ${lang}:\n\n> ${MINI_DICT[lang][src]}\n\nFor full paragraphs, connect a live AI provider in Settings → AI and I'll translate any text precisely.`, usage:simUsage(q,'')};
    return {text:`I can translate short phrases into Spanish, French, German, Italian and Portuguese on the built-in engine — for example *"translate hello to French"*. For longer passages, add a real provider key in **Settings → AI**, and I'll translate anything (target language: ${lang||'unspecified'}).`, usage:simUsage(q,'')};
  }

  // simplify / more detail follow-ups
  if(/\b(simpler|more simply|simply|eli5|like i'?m 5|plain english|in short)\b/.test(lower)){
    if(tinfo) return {text:`In simple terms: ${tinfo.simple}`, usage:simUsage(q,'')};
    if(topic) return {text:`In simple terms, ${topic} is best understood by focusing on what it does rather than how it works. ${q.length>12?'You asked about "'+topic+'". ':''}Tell me a bit more and I can go deeper.`, usage:simUsage(q,'')};
    return {text:"Happy to simplify — which part would you like me to re-explain?", usage:simUsage(q,'')};
  }
  if(/\b(more detail|go deeper|expand|tell me more|elaborate)\b/.test(lower)){
    if(tinfo) return {text:`More on **${topic}**:\n\n${tinfo.def}\n\n**Example:** ${tinfo.example}\n\n**Related:** ${tinfo.related.join(', ')}`, usage:simUsage(q,'')};
    if(topic) return {text:`Sure — tell me which aspect of **${topic}** matters most to you (how it works, where it's used, or its limits) and I'll go deeper.`, usage:simUsage(q,'')};
  }
  if(/\b(example|for instance)\b/.test(lower) && tinfo)
    return {text:`An example of **${topic}**: ${tinfo.example}`, usage:simUsage(q,'')};

  // writing
  if(/\b(write|draft|compose|help me write|email|caption|essay|post)\b/.test(lower)){
    const out=`Here's a first draft you can adapt:\n\n---\n**Subject / Title:** ${q.replace(/^(help me )?(write|draft|compose)\s*(a|an|the)?\s*/i,'').slice(0,70)||'Draft'}\n\nHi [Name],\n\nI wanted to reach out about ${topic||'the topic you mentioned'}. [One sentence of context — what prompted this.]\n\n[The main point, in one or two sentences. Be specific about what you need or are offering.]\n\n[The next step — when you'd like a reply, or what happens next.]\n\nBest regards,\n[Your name]\n---\n\nTell me the tone (friendly / formal / short) and the audience and I'll refine it. Connect a live provider for a fully customised draft.`;
    return {text:out, usage:simUsage(q,'')};
  }
  // brainstorm
  if(/\b(brainstorm|ideas|suggestions|name ideas|angles)\b/.test(lower)){
    const sub=topic||'your topic';
    const ideas=['Start from the user\'s sharpest pain point and lead with relief.','Frame it as a before/after story — concrete beats abstract.','Offer three tiers so there is an obvious "just right" option.','Use a simple checklist people can act on today.','Turn a common objection into the headline.','Make it shareable with one clear visual.','Add a short case study with real numbers.','Give a free, genuinely useful first step.'];
    return {text:`Here are 8 quick ideas for **${sub}**:\n\n`+ideas.map((x,i)=>`${i+1}. ${x}`).join('\n')+`\n\nWant me to expand any of these into a full plan?`, usage:simUsage(q,'')};
  }

  // main explain
  if(tinfo){
    return {text:`**${topic.replace(/\b\w/g,c=>c.toUpperCase())}**\n\n${tinfo.def}\n\n**In simple terms:** ${tinfo.simple}\n\n**Example:** ${tinfo.example}\n\n**Related:** ${tinfo.related.join(', ')}\n\nWant me to go deeper, give another example, or explain it more simply?`, usage:simUsage(q,'')};
  }
  if(topic || /^(what|why|how|when|where|who|explain|define)\b/.test(lower)){
    const raw=(q.replace(/^(what(?:'s| is| are)|why|how|when|where|who|which|explain|define|tell me about)\s*/i,'').replace(/^(is|are|was|were|does|do|did)\s+/i,'').replace(/\?+$/,'').trim());
    const subject=isValidTopic(raw)?raw:'that';
    return {text:`Here's what I can tell you about **${subject}** without a live AI provider connected:\n\nI don't have a verified entry for this on the built-in engine, so I won't guess. Connect a real provider in **Settings → AI** (OpenAI, Anthropic, Gemini, OpenRouter, Groq, Mistral or a local Ollama model) and I'll answer in full, with the conversation context carried across follow-ups.\n\nMeanwhile, I *can* explain topics like artificial intelligence, machine learning, JavaScript, Python, APIs, databases, WebSockets, HTTP, gravity and photosynthesis — just ask.`, usage:simUsage(q,''), limited:true};
  }

  // summarize
  if(/\b(summari[sz]e|tl;?dr|key points)\b/.test(lower) && q.length>60){
    const words=q.split(/\s+/); return {text:`Here's a short summary:\n\n• ${words.slice(0,12).join(' ')}…\n\nPaste the full text and, with a live provider connected, I'll produce an accurate summary with action points.`, usage:simUsage(q,'')};
  }

  return {text:"I don't have enough information to answer that on the built-in engine, and I'd rather tell you than invent something. Connect a real AI provider in **Settings → AI** and I'll answer completely. You can also tap **Contact Support** to reach a human.", usage:simUsage(q,''), limited:true};
}
function simUsage(q,a){ const p=Math.ceil(String(q).split(/\s+/).length*1.3)+8, c=Math.ceil(String(a).split(/\s+/).length*1.3)+8; return {prompt_tokens:p, completion_tokens:c, total_tokens:p+c}; }

/* --------------------------- provider requests --------------------------- */
async function requestProvider(settings, messages){
  const p=PROVIDERS[settings.provider]||PROVIDERS.simulated;
  const base=(settings.baseUrl||p.base||'').replace(/\/$/,'');
  const sys=settings.systemPrompt||'';
  const maxTok=Number(settings.maxTokens)||800, temp=Number(settings.temperature);
  const tempVal=isFinite(temp)?temp:0.7;

  if(settings.provider==='simulated') return null;

  if(settings.provider==='anthropic'){
    const res=await fetch(base+'/messages',{ method:'POST', headers:{'content-type':'application/json','x-api-key':settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}, body:JSON.stringify({model:settings.model,max_tokens:maxTok,temperature:tempVal,system:sys,messages:messages.filter(m=>m.role!=='system').map(m=>({role:m.role,content:m.content}))}) });
    if(!res.ok) throw new HttpErr(res.status);
    const j=await res.json();
    const text=(j.content||[]).map(b=>b.text||'').join('').trim();
    return {text, usage:j.usage?{prompt_tokens:j.usage.input_tokens,completion_tokens:j.usage.output_tokens,total_tokens:(j.usage.input_tokens||0)+(j.usage.output_tokens||0)}:null};
  }
  if(settings.provider==='gemini'){
    const model=settings.model||'gemini-1.5-flash';
    const contents=messages.filter(m=>m.role!=='system').map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));
    const body={contents, generationConfig:{maxOutputTokens:maxTok,temperature:tempVal}};
    if(sys) body.systemInstruction={parts:[{text:sys}]};
    const res=await fetch(`${base}/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(settings.apiKey)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    if(!res.ok) throw new HttpErr(res.status);
    const j=await res.json();
    const text=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(x=>x.text||'').join('').trim();
    const um=j.usageMetadata||{};
    return {text, usage:{prompt_tokens:um.promptTokenCount||0, completion_tokens:um.candidatesTokenCount||0, total_tokens:um.totalTokenCount||0}};
  }
  // OpenAI-compatible (openai, openrouter, groq, mistral, ollama, custom)
  const headers={'content-type':'application/json'};
  if(settings.apiKey) headers['authorization']='Bearer '+settings.apiKey;
  if(settings.provider==='openrouter'){ headers['http-referer']=location.origin; headers['x-title']='ChatFlow'; }
  const payload={model:settings.model,max_tokens:maxTok,temperature:tempVal,messages:[...(sys?[{role:'system',content:sys}]:[]),...messages]};
  const res=await fetch(base+'/chat/completions',{method:'POST',headers,body:JSON.stringify(payload)});
  if(!res.ok) throw new HttpErr(res.status);
  const j=await res.json();
  const text=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||'').trim();
  return {text, usage:j.usage?{prompt_tokens:j.usage.prompt_tokens,completion_tokens:j.usage.completion_tokens,total_tokens:j.usage.total_tokens}:null};
}
function HttpErr(status){ const e=new Error('http_'+status); e.status=status; return e; }

/* Main entry: chooses provider, falls back safely, records usage. */
async function aiGenerate(conv, settings){
  const history=conv.messages.filter(m=>!m.deleted && (m.senderId==='ai'||m.senderId===S.sessionId)).slice(-24)
    .map(m=>({role:m.senderId==='ai'?'assistant':'user', content:m.text}));
  const useReal=settings.enabled && settings.provider!=='simulated';
  if(useReal){
    try{
      const out=await requestProvider(settings, history);
      if(out&&out.text) return {text:out.text, usage:out.usage, engine:PROVIDERS[settings.provider].label+' · '+settings.model};
      throw new Error('empty');
    }catch(e){
      const rate=e&&e.status===429;
      const msg = rate
        ? "I'm getting a lot of requests right now and hit the provider's rate limit. Please try again in a moment."
        : AI_FALLBACK_MSG;
      S.ai.usage.errors.unshift({ts:now(), message:(e&&e.status)?('provider HTTP '+e.status):(e&&e.message)||'unknown', conv:conv.id});
      S.ai.usage.errors=S.ai.usage.errors.slice(0,30); save();
      // graceful fallback to the built-in engine so the demo still works
      const sim=simulatedAI(history, settings);
      return {text:msg+"\n\n_Showing a built-in answer in the meantime:_\n"+(sim.text||''), usage:sim.usage, engine:'built-in fallback', error:true};
    }
  }
  await new Promise(r=>setTimeout(r, 380+Math.random()*520));
  const sim=simulatedAI(history, settings);
  return {text:sim.text, usage:sim.usage, engine:'Built-in demo engine', limited:sim.limited, source:sim.source};
}
function recordAIUsage(usage, engine){
  if(!usage) usage={};
  const d=new Date(); const day=d.toISOString().slice(0,10);
  S.ai.usage.totalRequests++;
  S.ai.usage.totalTokens+=(usage.total_tokens||0);
  S.ai.usage.byDay[day]=(S.ai.usage.byDay[day]||0)+1;
}
function aiUsageToday(){ const day=new Date().toISOString().slice(0,10); return S.ai.usage.byDay[day]||0; }
function aiLimitReached(){ const l=S.ai.limits; return aiUsageToday()>=l.perDay; }

function doLogin(){
  const id=($('#li_user').value||'').trim().toLowerCase(), pw=$('#li_pass').value||'';
  if(!id||!pw) return toast('Enter your email/username and password','alert');
  const u=S.users.find(x=>x.email.toLowerCase()===id||x.username.toLowerCase()===id);
  if(!u) return toast('No account found with those details','alert');
  if(u.password!==pw) return toast('Incorrect password','alert');
  if(S.admin.requireEmailVerify && !u.verified) { AUTH.temp=u; AUTH.code=randCode(); return gotoAuth('verify'); }
  enterApp(u);
}

function doSignup(){
  const name=($('#su_name').value||'').trim(), username=($('#su_username').value||'').trim().toLowerCase();
  const email=($('#su_email').value||'').trim().toLowerCase(), phone=($('#su_phone').value||'').trim();
  const pw=$('#su_pass').value||'', pw2=$('#su_pass2').value||'';
  if(!S.admin.registrationOpen) return toast('Registrations are currently closed','alert');
  if(!name||!username||!email||!pw) return toast('Please fill in all required fields','alert');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Enter a valid email address','alert');
  if(pw.length<6) return toast('Password must be at least 6 characters','alert');
  if(pw!==pw2) return toast('Passwords do not match','alert');
  if(!$('#su_terms').checked) return toast('Please accept the Terms and Privacy Policy','alert');
  if(S.users.some(u=>u.email.toLowerCase()===email)) return toast('An account with that email already exists','alert');
  if(S.users.some(u=>u.username.toLowerCase()===username)) return toast('That username is taken','alert');
  const u={id:uid('u'),name,username,email,phone,about:'Hey there! I am using ChatFlow.',password:pw,verified:false,role:'user',online:true,lastSeen:now()};
  S.users.push(u); save();
  AUTH.temp=u; AUTH.code=randCode(); gotoAuth('verify');
}
function doVerify(){
  const code=[0,1,2,3,4,5].map(k=>{const e=$('#otp'+k);return e?e.value:'';}).join('');
  if(code!==AUTH.code) return toast('That code does not match. Try again.','alert');
  const u=AUTH.temp; if(!u) return gotoAuth('login');
  u.verified=true; save();
  toast('Email verified ✓');
  gotoAuth('profile');
}

function searchMatchUsers(q){ if(!q) return []; q=q.toLowerCase();
  return S.users.filter(u=>u.id!==ME.id && (u.name.toLowerCase().includes(q)||u.username.toLowerCase().includes(q))).slice(0,6); }
function searchMatchMessages(q){ if(!q||q.length<2) return []; const out=[]; const ql=q.toLowerCase();
  for(const c of visibleConvs()){ for(const m of (c.messages||[])){ if(!m.deleted && m.text && m.text.toLowerCase().includes(ql)){ out.push({conv:c,msg:m}); if(out.length>=8) return out; } } }
  for(const c of S.conversations.filter(c=>c.type==='ai'&&c.memberIds.includes(ME.id))){ for(const m of (c.messages||[])){ if(!m.deleted&&m.text&&m.text.toLowerCase().includes(ql)&&!out.some(o=>o.conv.id===c.id&&o.msg.id===m.id)){ out.push({conv:c,msg:m}); if(out.length>=12) return out; } } }
  return out; }
function visibleConvs(){ return S.conversations.filter(c=>c.memberIds.includes(ME.id)); }
function chatsListHTML(){
  const q=(S.ui.search||'').trim();
  let convs=visibleConvs();
  if(S.ui.filter==='unread') convs=convs.filter(c=>(c.messages||[]).some(m=>m.senderId!==ME.id&&m.status!=='read'&&!m.deleted));
  if(S.ui.filter==='groups') convs=convs.filter(c=>c.type==='group');
  if(S.ui.filter==='ai') convs=convs.filter(c=>c.type==='ai');
  if(q) convs=convs.filter(c=>convTitle(c).toLowerCase().includes(q.toLowerCase()));
  convs=convs.slice().sort((a,b)=>((convLast(b)||{}).ts||b.createdAt||0)-((convLast(a)||{}).lastTs||(convLast(a)||{}).ts||a.createdAt||0));
  const users=searchMatchUsers(q);

    <div class="conv" onclick="startDM('${u.id}')">${avatar(u)}<div class="body"><div class="name">${esc(u.name)}</div><div class="msg">@${esc(u.username)}</div></div><button class="btn btn-sm btn-outline" onclick="event.stopPropagation();startDM('${u.id}')">Message</button></div>`).join('');

  if(m.deleted){ body=`<div class="txt" style="font-style:italic;color:var(--muted)">${ic('ban','sm')} This message was deleted</div>`; }
  else{
    if(quoted) body+=`<div class="reply-quote" onclick="scrollToMsg('${quoted.id}')"><b>${esc(userById(quoted.senderId)?userById(quoted.senderId).name:'Unknown')}</b><span>${esc((quoted.text||'Attachment').slice(0,70))}</span></div>`;
    if(media){
      if(media.type==='image') body+=`<img class="attach" src="${media.data||'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200"><rect width="320" height="200" fill="#0ea47a"/><text x="160" y="105" font-size="16" fill="#fff" text-anchor="middle" font-family="sans-serif">'+esc(media.name)+'</text></svg>')}" alt="${esc(media.name)}" onclick="viewImage('${m.id}')">`;
      else if(media.type==='video') body+=`<div class="doc" style="min-width:230px"><div class="di">${ic('film')}</div><div><div class="dn">${esc(media.name)}</div><div class="ds">Video · ${bytes(media.size||0)}</div></div></div>`;
      else if(media.type==='voice') body+=`<div class="voice"><button class="play" onclick="playVoice(this)">${ic('send','sm')}</button><div class="wave">${Array.from({length:26},(_,i)=>`<i style="animation-delay:${(i%7)*0.09}s"></i>`).join('')}</div><div class="dur">0:${String(media.dur||8).padStart(2,'0')}</div></div>`;
      else body+=`<div class="doc"><div class="di">${ic('file')}</div><div><div class="dn">${esc(media.name)}</div><div class="ds">${esc(media.ext||'Document')} · ${bytes(media.size||0)}</div></div></div>`;
    }
    if(m.text) body+=`<div class="txt">${highlight(m.text)}</div>`;
  }
  if(isAI && m.meta && !m.deleted) body+=`<div class="tiny muted" style="margin-top:5px;border-top:1px dashed var(--border);padding-top:4px">${ic('cpu','sm')} ${esc(m.meta.engine||'AI')}${m.meta.usage?` · ${m.meta.usage.total_tokens||0} tokens`:''}${m.meta.latency?` · ${(m.meta.latency/1000).toFixed(1)}s`:''}${m.meta.source?` · ${esc(m.meta.source)}`:''}</div>`;
  const status = out ? (m.status==='read'?ic('checks','sm'):m.status==='delivered'?ic('checks','sm'):ic('check','sm')) : '';
  const meta=`<div class="meta">${m.forwarded?ic('forward','sm'):''}${m.edited&&!m.deleted?'<span class="edited">edited</span>':''}<span>${fmtTime(m.ts)}</span>${status}</div>`;
  return `<div class="msg ${out?'out':''} ${media?'media':''}" id="msg-${m.id}">
    <div class="bubble">
      ${c.type==='group'&&!out?`<div style="font-size:12px;font-weight:700;color:${colorFor(sender.name)};margin-bottom:2px">${esc(sender.name)}</div>`:''}
      ${body}${meta}
    </div>
    ${rec.length?`<div class="reactions">${rec.map(([e,us])=>`<span class="r" onclick="reactTo('${c.id}','${m.id}')">${e} ${us.length>1?us.length:''}</span>`).join('')}</div>`:''}
    ${tools}
  </div>`;
}
function highlight(txt){
  let h=linkify(txt);
  h=h.replace(/`([^`]+)`/g,'<code style="background:rgba(127,127,127,.16);padding:1px 5px;border-radius:5px;font-family:ui-monospace,Menlo,monospace;font-size:12.8px">$1</code>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');
  h=h.replace(/^&gt;\s?(.*)$/gm,'<span style="display:block;border-left:3px solid var(--accent);padding-left:9px;color:var(--muted)">$1</span>');
  return h;
}

function toggleRecord(){

    const c=activeConv(); if(c) pushMessage(c,{senderId:ME.id,attachment:{type:'voice',name:'voice-message.m4a',size:secs*8000,dur:secs},status:'sent'});

  row.innerHTML=`<div class="recording"><span class="rec-dot"></span><span id="recTime">0:00</span><span style="color:var(--muted);font-weight:500">Recording… tap the mic to send</span></div><button class="mic-btn" onclick="toggleRecord()">${ic('check')}</button><button class="icon-btn" onclick="cancelRecord()">${ic('trash')}</button>`;

/* ------------------------------ message ops ------------------------------ */
function pushMessage(c,data){
  const m = {id:uid('m'),ts:now(),reactions:{},...data};
  c.messages=c.messages||[]; c.messages.push(m);
  save(); refreshList();
  if(c.id===S.ui.activeConv){ const sc=$('#msgScroll'); if(sc){ sc.innerHTML=messagesHTML(c); scrollBottom(); } else { refreshMain(); } }
  if(data.senderId===ME.id) simulateNetwork(c,m);
  return m;
}
function simulateNetwork(c,m){
  // delivery + read receipts
  setTimeout(()=>{ if(m.status==='sent'){ m.status='delivered'; save(); updateTicks(c,m); } }, 700+Math.random()*500);
  setTimeout(()=>{ if(m.status!=='read'){ m.status='read'; save(); updateTicks(c,m); } }, 1600+Math.random()*1200);
  // simulated reply in human conversations
  if(c.type==='ai') return;
  if(Math.random()<0.15) return; // sometimes no reply
  const responder=c.type==='group'?c.memberIds.filter(x=>x!==ME.id&&x!=='ai')[Math.floor(Math.random()*(c.memberIds.length-1))]:c.memberIds.find(x=>x!==ME.id);
  if(!responder) return;
  const delay=1200+Math.random()*1800;
  setTimeout(()=>{ TYPING[c.id]=responder; if(c.id===S.ui.activeConv){ const sc=$('#msgScroll'); if(sc){ sc.innerHTML=messagesHTML(c); scrollBottom(); } }
    setTimeout(()=>{ delete TYPING[c.id];
      const replies=SCRIPTED[responder]||SCRIPTED.default;
      const text=replies[Math.floor(Math.random()*replies.length)];
      const inc={id:uid('m'),senderId:responder,text,ts:now(),status:c.id===S.ui.activeConv?'read':'delivered',reactions:{}};
      c.messages.push(inc); save(); refreshList();
      if(c.id===S.ui.activeConv){ const sc=$('#msgScroll'); if(sc){ sc.innerHTML=messagesHTML(c); scrollBottom(); } }
      else if(S.prefs.notifications) toast((userById(responder)||{}).name+': '+text.slice(0,40));
    }, 900+Math.random()*1400);
  }, delay);
}
function updateTicks(c,m){ if(c.id!==S.ui.activeConv) return; const nodes=$$('#msg-'+m.id+' .meta .ic'); if(nodes.length){ const el=nodes[nodes.length-1]; el.outerHTML=m.status==='read'?ic('checks','sm'):ic('check','sm'); } }
function scrollBottom(instant){ const sc=$('#msgScroll'); if(sc) sc.scrollTo({top:sc.scrollHeight,behavior:instant?'auto':'smooth'}); }
function sendMessage(){ const inp=$('#composerInput'); if(!inp) return; const txt=inp.value.trim(); const c=activeConv(); if(!c) return;
  if(!txt&&!REPLY_TO) return;
  if(c.type==='ai'&&txt.length>(S.ai.requestMaxChars||4000)) return toast('Message is too long (max '+(S.ai.requestMaxChars||4000)+' characters)','alert');
  const data={senderId:ME.id,text:txt,status:'sent'};
  if(REPLY_TO&&REPLY_TO.conv===c.id){ data.replyTo=REPLY_TO.id; }
  REPLY_TO=null; inp.value=''; inp.style.height='auto';
  const msg=pushMessage(c,data);
  if(c.type==='ai') respondAsAI(c,msg);
}
function setReply(convId,msgId){ const c=S.conversations.find(x=>x.id===convId); const m=findMsg(c,msgId); if(!m) return; REPLY_TO={conv:convId,id:msgId,senderId:m.senderId,text:m.text||''}; const comp=$('.composer'); if(comp) comp.outerHTML=composerHTML(c); const inp=$('#composerInput'); if(inp) inp.focus(); }
function clearReply(){ REPLY_TO=null; const c=activeConv(); const comp=$('.composer'); if(comp&&c) comp.outerHTML=composerHTML(c); }
function copyMsg(id){ const c=activeConv(); const m=findMsg(c,id); if(!m) return; navigator.clipboard&&navigator.clipboard.writeText(m.text||'').catch(()=>{}); toast('Copied to clipboard'); }
function reactTo(convId,msgId){
  const c=S.conversations.find(x=>x.id===convId); const m=findMsg(c,msgId); if(!m) return;
  const set=['👍','❤️','😂','😮','🙏','🎉'];
  modal({title:'React to message', body:`<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px;font-size:26px" id="reactGrid">${set.map(e=>`<button onclick="applyReact('${convId}','${msgId}','${e}')" style="padding:8px;border-radius:12px">${e}</button>`).join('')}</div>`});
}
function applyReact(convId,msgId,e){ const c=S.conversations.find(x=>x.id===convId); const m=findMsg(c,msgId); if(!m) return;
  m.reactions=m.reactions||{}; const arr=m.reactions[e]||[]; const i=arr.indexOf(ME.id);
  if(i>=0) arr.splice(i,1); else arr.push(ME.id);
  if(!arr.length) delete m.reactions[e]; else m.reactions[e]=arr;
  save(); closeModal(); if(c.id===S.ui.activeConv){ const sc=$('#msgScroll'); if(sc) sc.innerHTML=messagesHTML(c); } }

}
function applyDelete(convId,msgId){ const c=S.conversations.find(x=>x.id===convId); const m=findMsg(c,msgId); if(!m) return;
  m.deleted=true; m.text=''; m.attachment=null; m.reactions={}; save(); closeModal(); refreshList(); if(c.id===S.ui.activeConv){ const sc=$('#msgScroll'); if(sc) sc.innerHTML=messagesHTML(c); } }
function forwardMsg(convId,msgId){ const c=S.conversations.find(x=>x.id===convId); const m=findMsg(c,msgId); if(!m) return;

  t.messages=t.messages||[]; t.messages.push({id:uid('m'),senderId:ME.id,text:m.text,attachment:m.attachment,ts:now(),status:'sent',reactions:{},forwarded:true});

function applyTheme(){
  document.documentElement.dataset.theme=S.theme;
  const w=S.prefs.wallpaper||'default';
  const bgs={
    default:'radial-gradient(circle at 12% 20%,rgba(14,164,122,.06),transparent 42%),radial-gradient(circle at 88% 78%,rgba(59,130,246,.06),transparent 42%)',
    plain:'#eef2f5',
    doodle:'repeating-linear-gradient(45deg,rgba(14,164,122,.05) 0 12px,transparent 12px 24px),#f6f8fa',
    bubbles:'radial-gradient(circle at 20% 30%,rgba(52,211,153,.12),transparent 30%),radial-gradient(circle at 70% 70%,rgba(139,92,246,.10),transparent 30%),#eef2f5'
  };
  const darkBg={ plain:'#0b141a', doodle:'#0e181e', bubbles:'#0b141a', default:bgs.default };

/* ------------------------------- AI respond ------------------------------ */
async function respondAsAI(conv){
  if(!S.ai.enabled||!S.admin.aiGloballyEnabled){ pushMessage(conv,{senderId:'ai',text:'The AI assistant is currently turned off by the administrator. Please try again later or contact support.',status:'read'}); return; }
  if(aiLimitReached()){ pushMessage(conv,{senderId:'ai',text:'You have reached today\'s AI limit of '+S.ai.limits.perDay+' messages. It resets at midnight, or the administrator can raise the limit in AI settings.',status:'read'}); return; }
  TYPING[conv.id]='ai';
  if(conv.id===S.ui.activeConv){ const sc=$('#msgScroll'); if(sc){ sc.innerHTML=messagesHTML(conv); scrollBottom(); } }
  const t0=now();
  let res;
  try{ res=await aiGenerate(conv,S.ai); }
  catch(e){ res={text:AI_FALLBACK_MSG, usage:null, engine:'error'}; }
  delete TYPING[conv.id];
  recordAIUsage(res.usage,res.engine); save();
  const msg={id:uid('m'),senderId:'ai',text:res.text,ts:now(),status:conv.id===S.ui.activeConv?'read':'delivered',reactions:{},meta:{engine:res.engine,usage:res.usage,latency:now()-t0,limited:res.limited,source:res.source}};
  conv.messages.push(msg); save(); refreshList();
  if(conv.id===S.ui.activeConv){ const sc=$('#msgScroll'); if(sc){ sc.innerHTML=messagesHTML(conv); scrollBottom(); } }
  else if(S.prefs.notifications) toast('ChatFlow AI replied');
}

function saveProfile(){
  const name=$('#pf_name').value.trim(), user=$('#pf_user').value.trim().toLowerCase();

  if(S.users.some(u=>u.id!==ME.id&&u.username===user)) return toast('That username is taken','alert');
  ME.name=name; ME.username=user; ME.about=$('#pf_ab').value.trim(); ME.phone=$('#pf_phone').value.trim();
  save(); renderApp(); toast('Profile saved');
}

function onProviderChange(v){ const cur={name:$('#ai_name').value,welcome:$('#ai_welcome').value,personality:$('#ai_personality').value,sys:$('#ai_sys').value}; S.ai.provider=v; S.ai.model=(PROVIDERS[v].models[0]||S.ai.model); save(); renderApp(); toast(PROVIDERS[v].label+' selected'); }
function saveAISettings(){
  S.ai.enabled=$('#ai_enabled').checked;
  S.ai.name=$('#ai_name').value.trim()||'ChatFlow AI';
  S.ai.welcome=$('#ai_welcome').value;
  S.ai.personality=$('#ai_personality').value;
  S.ai.systemPrompt=$('#ai_sys').value;
  S.ai.model=$('#ai_model').value;
  if($('#ai_key')&&$('#ai_key').value.trim()) S.ai.apiKey=$('#ai_key').value.trim();
  if($('#ai_base')) S.ai.baseUrl=$('#ai_base').value.trim();
  S.ai.maxTokens=Math.max(64,Math.min(8000,parseInt($('#ai_maxtok').value||'800',10)));
  S.ai.temperature=Math.max(0,Math.min(2,parseFloat($('#ai_temp').value||'0.7')));
  S.ai.limits.perDay=Math.max(1,parseInt($('#ai_perday').value||'60',10));
  S.ai.limits.perMonth=Math.max(1,parseInt($('#ai_permonth').value||'1200',10));
  S.ai.requestMaxChars=Math.max(100,parseInt($('#ai_reqmax').value||'4000',10));
  S.ai.limits.maxResponseChars=Math.max(200,parseInt($('#ai_resmax').value||'6000',10));
  S.ui.aiConfigured=S.ai.provider!=='simulated'&&(!PROVIDERS[S.ai.provider].needsKey||!!S.ai.apiKey);
  AI_USER.name=S.ai.name;
  save(); renderApp(); toast('AI settings saved');
}
async function testAIConnection(){
  if(S.ai.provider==='simulated') return toast('Built-in engine is always available');
  saveAISettings();
  toast('Testing connection…');
  try{ const out=await requestProvider(S.ai,[{role:'user',content:'Reply with the single word: OK'}]); if(out&&out.text) toast('Connection OK — '+(out.text.slice(0,40))); else toast('No response from provider','alert'); }
  catch(e){ toast('Connection failed'+(e&&e.status?' (HTTP '+e.status+')':''),'alert'); }
}

  let body='';
  if(tab==='overview'){ body=`
    <div class="grid4">${[['Users',d.users,'list'],['Active now',d.active,'activity'],['New (24h)',d.newUsers,'plus'],['Messages',d.messages,'chat']].map(s=>`<div class="stat"><div class="lbl">${ic(s[2],'sm')} ${s[0]}</div><div class="val">${s[1]}</div></div>`).join('')}</div>
    <div class="grid4 mt16">${[['AI conversations',d.aiConvs,'sparkles'],['AI requests',d.aiUsage,'cpu'],['AI tokens',d.aiTokens.toLocaleString(),'gauge'],['Open reports',d.reports,'flag']].map(s=>`<div class="stat"><div class="lbl">${ic(s[2],'sm')} ${s[0]}</div><div class="val">${s[1]}</div></div>`).join('')}</div>
    <div class="card mt16"><h3>System status</h3><div class="desc">Live status of ChatFlow services.</div>
      ${[['API & realtime','Operational',true],['Database','Operational',true],['AI provider',(S.ai.provider==='simulated'?'Built-in engine':(S.ai.usage.errors.length?'Degraded':'Operational')),S.ai.usage.errors.length===0],['File storage','Operational',true],['Email delivery','Operational',true]].map(s=>`<div class="set-row"><div class="si" style="color:${s[2]?'var(--accent)':'var(--warn)'}">${ic('activity','sm')}</div><div class="st"><b>${s[0]}</b><span>${s[1]}</span></div><span class="pill ${s[2]?'ok':'warn'}">${s[2]?'Healthy':'Check'}</span></div>`).join('')}
    </div>
    <div class="grid2 mt16">
      <div class="card"><h3>AI usage · last 7 days</h3><div class="desc">Requests per day.</div>${last7Bars()}</div>
      <div class="card"><h3>Conversation mix</h3><div class="desc">Direct, group and AI conversations.</div>${mixBars(d)}</div>
    </div>`; }
  else if(tab==='users'){ body=`<div class="card"><h3>Registered users</h3><div class="desc">Manage accounts, roles and verification.</div>
    <table class="tbl"><thead><tr><th>User</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>
    ${S.users.map(u=>`<tr><td><div class="flex">${avatar(u,'xs')}<div><b>${esc(u.name)}</b><div class="tiny muted">@${esc(u.username)} · ${esc(u.email)}</div></div></div></td>
      <td>${u.role==='admin'?'<span class="admin-badge">ADMIN</span>':esc(u.role||'user')}</td>
      <td>${u.verified?'<span class="pill ok">Verified</span>':'<span class="pill warn">Pending</span>'}</td>
      <td class="flex" style="gap:2px"><button class="icon-btn" title="Message" onclick="startDM('${u.id}')">${ic('chat','sm')}</button>
        ${u.id===ME.id?'':`<button class="icon-btn" title="Verify" onclick="adminVerify('${u.id}')">${ic('circleCheck','sm')}</button>
        <button class="icon-btn" title="Toggle admin" onclick="adminRole('${u.id}')">${ic('shield','sm')}</button>
        <button class="icon-btn" title="Remove" onclick="adminDeleteUser('${u.id}')">${ic('trash','sm')}</button>`}</td></tr>`).join('')}
    </tbody></table></div>`; }
  else if(tab==='ai'){ body=`<div class="alert info">${ic('info','sm')}<div>These settings control ChatFlow AI for every user. Knowledge base entries are used for business-specific questions.</div></div>`+pageAI(); }
  else if(tab==='reports'){ body=`<div class="card"><h3>Reports &amp; moderation</h3><div class="desc">Reported users and messages awaiting review.</div>
    ${S.reports.map(r=>`<div class="set-row"><div class="si" style="color:${r.status==='open'?'var(--warn)':'var(--accent)'}">${ic('flag','sm')}</div><div class="st"><b>${esc(r.target)} <span class="pill ${r.status==='open'?'warn':'ok'}">${r.status}</span></b><span>${esc(r.reason)} · reported by ${esc(r.by)} · ${timeAgo(r.ts)}</span></div>
      ${r.status==='open'?`<button class="btn btn-outline btn-sm" onclick="resolveReport('${r.id}')">Resolve</button>`:''}</div>`).join('')}</div>`; }
  else if(tab==='system'){ body=`<div class="card"><h3>System &amp; access</h3>
      ${toggleRow('user','Registration open','Allow new users to sign up','registrationOpen','admin')}
      ${toggleRow('mail','Require email verification','New accounts must verify their email','requireEmailVerify','admin')}
      ${toggleRow('sparkles','AI assistant globally enabled','Master switch for ChatFlow AI','aiGloballyEnabled','admin')}
      ${toggleRow('alert','Maintenance mode','Show a maintenance notice to all users','maintenance','admin')}
      <div class="field mt16"><label>Max members per group</label><input class="input" type="number" value="${S.admin.maxGroupSize}" onchange="S.admin.maxGroupSize=parseInt(this.value||'256',10);save();toast('Updated')"></div>
    </div>
    <div class="card"><h3>Data &amp; backup</h3><div class="desc">Export or reset the local demo store.</div>
      <div class="flex" style="gap:8px;flex-wrap:wrap"><button class="btn btn-outline btn-sm" onclick="exportData()">${ic('download','sm')} Export all data</button><button class="btn btn-danger btn-sm" onclick="resetDemo()">${ic('refresh','sm')} Reset demo</button></div></div>
    <div class="card"><h3>Error monitoring</h3><div class="desc">Latest AI provider errors.</div>${S.ai.usage.errors.length?S.ai.usage.errors.slice(0,8).map(e=>`<div class="set-row"><div class="si" style="color:var(--danger)">${ic('alert','sm')}</div><div class="st"><b>${esc(e.message)}</b><span>${timeAgo(e.ts)}</span></div></div>`).join(''):'<div class="muted tiny">No errors recorded.</div>'}</div>`; }
  return `<div class="page-head"><div><h2>Admin dashboard</h2><p>Overview of users, activity, AI usage and system health.</p></div><span class="admin-badge">${ic('shield','sm')} ADMIN</span></div>
  <div class="page-body"><div class="tabs">${[['overview','Overview'],['users','Users'],['ai','AI settings'],['reports','Reports'],['system','System']].map(t=>`<button class="${tab===t[0]?'active':''}" onclick="S.ui.adminTab='${t[0]}';save();renderApp()">${t[1]}</button>`).join('')}</div>${body}</div>`;
}
function last7Bars(){ const days=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const key=d.toISOString().slice(0,10); days.push({k:key,l:d.toLocaleDateString(undefined,{weekday:'short'}),v:S.ai.usage.byDay[key]||0}); }
  const max=Math.max(1,...days.map(d=>d.v));
  return `<div class="flex" style="align-items:flex-end;gap:10px;height:130px;margin-top:10px">${days.map(d=>`<div class="grow center" style="display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div class="tiny muted">${d.v}</div><div style="height:${Math.max(4,Math.round(d.v/max*86))}%;background:linear-gradient(180deg,var(--accent-2),var(--accent));border-radius:7px 7px 3px 3px;margin:4px 0"></div><div class="tiny muted">${d.l}</div></div>`).join('')}</div>`; }
function mixBars(d){ const dm=visibleConvs().filter(c=>c.type==='dm').length, grp=d.groups, ai=d.aiConvs; const tot=Math.max(1,dm+grp+ai);
  return [['Direct',dm,'var(--accent)'],['Group',grp,'#8b5cf6'],['AI',ai,'#3b82f6']].map(x=>`<div style="margin-top:12px"><div class="between tiny"><span>${x[0]}</span><b>${x[1]}</b></div><div class="bar"><i style="width:${Math.round(x[1]/tot*100)}%;background:${x[2]}"></i></div></div>`).join(''); }
function adminVerify(id){ const u=S.users.find(x=>x.id===id); u.verified=true; save(); renderApp(); toast('User verified'); }
function adminRole(id){ const u=S.users.find(x=>x.id===id); u.role=u.role==='admin'?'user':'admin'; save(); renderApp(); toast('Role updated'); }
function adminDeleteUser(id){ const u=S.users.find(x=>x.id===id); modal({title:'Remove user', body:`<p class="muted" style="margin:0">Remove <b>${esc(u.name)}</b> and all their conversations? This cannot be undone.</p>`, foot:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="applyAdminDelete('${id}')">Remove</button>`}); }
function applyAdminDelete(id){ S.users=S.users.filter(u=>u.id!==id); S.conversations=S.conversations.filter(c=>!c.memberIds.includes(id)); save(); closeModal(); renderApp(); toast('User removed'); }
function resolveReport(id){ const r=S.reports.find(x=>x.id===id); r.status='resolved'; save(); renderApp(); toast('Report resolved'); }

/* --------------------------------- boot ---------------------------------- */
function init(){
  const saved=load();
  S=saved||defaultState();
  // forward-compatibility with older stored states
  S.ai=Object.assign(defaultAISettings(), S.ai||{});
  S.ai.limits=Object.assign(defaultAISettings().limits, (S.ai&&S.ai.limits)||{});
  S.prefs=Object.assign({notifications:true,sounds:true,readReceipts:true,showLastSeen:true,wallpaper:'default',messageSize:'medium',enterToSend:true,twoStep:false}, S.prefs||{});
  S.admin=Object.assign({registrationOpen:true,requireEmailVerify:true,maxGroupSize:256,maintenance:false,aiGloballyEnabled:true}, S.admin||{});
  S.ui=Object.assign({view:'chats',activeConv:null,filter:'all',search:'',aiConfigured:false,settingsTab:'profile',adminTab:'overview'}, S.ui||{});
  if(!S.reports) S.reports=[];
  if(!S.blocked) S.blocked=[];
  applyTheme();
  const session=S.sessionId&&S.users.find(u=>u.id===S.sessionId);
  if(session){ ME=session; bootApp(); }
  else { AUTH.mode='login'; renderAuth(); }
}
document.addEventListener('DOMContentLoaded', init);
window.addEventListener('resize', ()=>{ const wide=window.innerWidth>820; if(wide) document.body.setAttribute('data-mobile','list'); else if(S&&S.ui&&S.ui.activeConv&&S.ui.view==='chats') document.body.setAttribute('data-mobile','chat'); });

</script>
</body>
</html>
